name: Build

on:
  workflow_dispatch:
    inputs:
      client_version:
        description: Patch / Client version (e.g. 0.0.1, 0.0.2)
        required: true
        default: 0.0.1
        type: string
      build_mode:
        description: Build mode (patch_only or full_installer)
        required: true
        default: patch_only
        type: choice
        options:
          - patch_only
          - full_installer
      client_tag:
        description: Client tag (Only needed for full installer - leave blank for patch_only)
        required: false
        default: ''
        type: string
      force_redownload:
        description: Force redownload base game (ignore cache, full_installer only)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      client_version:
        description: Client version
        required: false
        type: string
        default: 0.0.1
      build_mode:
        description: Build mode (patch_only or full_installer)
        required: false
        type: string
        default: patch_only
      client_tag:
        description: Optional client/game-net build tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.client_tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (vs2022, Release, x86)
    runs-on: windows-2022

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_bincache
      BASE_GAME_CACHE_VERSION: v2
      BASE_GAME_ARCHIVE: ${{ github.workspace }}/base-game-cache/Allclient.rar

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: true

      - name: Verify checked-out source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:GITHUB_SHA) {
            throw "Checkout mismatch: expected $env:GITHUB_SHA but found $actualCommit."
          }
          $brokenSubmodules = @(git submodule status --recursive | Where-Object { $_ -match '^[-+U]' })
          if ($brokenSubmodules.Count -gt 0) {
            throw "One or more submodules do not match the checked-out commit."
          }
          Write-Host "Building exact repository commit: $actualCommit"

      - name: Prepare client build tag
        shell: pwsh
        env:
          REQUESTED_CLIENT_TAG: ${{ inputs.client_tag }}
        run: |
          $tag = $env:REQUESTED_CLIENT_TAG.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (Get-Content -LiteralPath "client_tags.txt" -Raw).Trim()
          }

          if ($tag.Length -gt 64 -or $tag -notmatch '^[A-Za-z0-9_-]+$') {
            throw "Invalid client tag. Use 1-64 letters, numbers, underscores or hyphens."
          }

          Set-Content -LiteralPath "client_tags.txt" -Value $tag -Encoding ascii -NoNewline
          "CLIENT_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building NextClient for tag: $tag"

      - name: Cache base game archive
        id: base-game-cache
        if: (inputs.build_mode == 'full_installer') && (inputs.force_redownload != true)
        uses: actions/cache@v4
        with:
          path: base-game-cache/Allclient.rar
          key: base-game-${{ runner.os }}-${{ env.BASE_GAME_CACHE_VERSION }}

      - name: Download base game from GitHub Release
        if: (inputs.build_mode == 'full_installer') && (steps.base-game-cache.outputs.cache-hit != 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:BASE_GAME_ARCHIVE) | Out-Null

          Write-Host "Downloading the base game from GitHub Releases..."
          gh release download base_game -R ${{ github.repository }} -p "CS.1.6.-.AllClient.rar" -O $env:BASE_GAME_ARCHIVE

          if ($LASTEXITCODE -eq 0 -and
              (Test-Path -LiteralPath $env:BASE_GAME_ARCHIVE -PathType Leaf) -and
              (Get-Item -LiteralPath $env:BASE_GAME_ARCHIVE).Length -gt 100MB) {
            Write-Host "Download successful."
          } else {
            throw "The base game could not be downloaded from GitHub Releases. Please ensure the release 'base_game' exists and contains 'CS.1.6.-.AllClient.rar'."
          }

      - name: Validate and extract base game
        if: inputs.build_mode == 'full_installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip is not available on this GitHub runner."
          }

          & $sevenZip t $env:BASE_GAME_ARCHIVE -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) {
            throw "The base game archive is corrupt or incomplete."
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "allclient-base"
          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $sevenZip x $env:BASE_GAME_ARCHIVE "-o$extractDir" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract the base game."
          }

          $rootFiles = @(Get-ChildItem -LiteralPath $extractDir -Force -File)
          $rootDirs = @(Get-ChildItem -LiteralPath $extractDir -Force -Directory)
          if ($rootFiles.Count -eq 0 -and $rootDirs.Count -eq 1) {
            $gameRoot = $rootDirs[0].FullName
          } else {
            $gameRoot = $extractDir
          }

          $installDir = Join-Path $env:GITHUB_WORKSPACE "install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Get-ChildItem -LiteralPath $gameRoot -Force | Copy-Item -Destination $installDir -Recurse -Force

          $baseFileCount = @(Get-ChildItem -LiteralPath $installDir -Recurse -File).Count
          if ($baseFileCount -lt 10) {
            throw "The extracted base game does not contain the expected files."
          }
          Write-Host "Base game prepared successfully ($baseFileCount files)."

      - name: Ensure install directory exists for patch build
        if: inputs.build_mode != 'full_installer'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:GITHUB_WORKSPACE "install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $installDir "cstrike\cl_dlls") | Out-Null
          Write-Host "Prepared clean install directory for patch-only build."

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'custom-vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_bincache" | Out-Null

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: cmake --fresh --preset vs2022 "-DNEXTCLIENT_INSTALL_DIR=${{ github.workspace }}\install"

      - name: Build
        run: cmake --build --preset vs2022-release --target BUILD_ALL -- /m:2 /nodeReuse:false /v:minimal

      - name: Prepare installer metadata
        shell: pwsh
        env:
          REQUESTED_CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "tagged-output"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $buildVersion = $env:REQUESTED_CLIENT_VERSION.Trim()
          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            $cmakeText = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "CMakeLists.txt") -Raw
            $buildVersion = "0.0.1"
            if ($cmakeText -match 'project\s*\(\s*NextClient\s+VERSION\s+([0-9\.]+)') {
              $buildVersion = $matches[1]
            }
          }
          "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @(
            "Client tag: $env:CLIENT_TAG"
            "Version: $buildVersion"
            "Commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_RUN_NUMBER"
          ) | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "install\build-info.txt") -Encoding utf8

          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "install\version.txt") -Value $buildVersion -Encoding ascii -NoNewline
          Copy-Item -LiteralPath "pinned_servers.txt" -Destination (Join-Path $env:GITHUB_WORKSPACE "install\pinned_servers.txt") -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath "mix_servers.txt" -Destination (Join-Path $env:GITHUB_WORKSPACE "install\mix_servers.txt") -Force -ErrorAction SilentlyContinue

          @(
            "## Tagged NextClient build"
            ""
            "- Client tag: ``$env:CLIENT_TAG``"
            "- Version: ``$buildVersion``"
            "- Build mode: ``${{ inputs.build_mode }}``"
            "- Output: installer EXE (if full) and lightweight patch ZIP"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Prepare hosting panel package
        if: inputs.build_mode == 'full_installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hostingStage = Join-Path $env:RUNNER_TEMP "allclient-hosting"
          $hostingZip = Join-Path $env:GITHUB_WORKSPACE "tagged-output\Allclient-$env:CLIENT_TAG-Hosting.zip"

          Remove-Item -LiteralPath $hostingStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $hostingStage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $hostingStage "admin") | Out-Null

          Copy-Item -Path "hosting\admin\*" -Destination (Join-Path $hostingStage "admin") -Recurse -Force
          Copy-Item -LiteralPath "hosting\installer_access.php" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "hosting\update_access.php" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "hosting\update_api.php" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "hosting\api.php" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "pinned_servers.txt" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "mix_servers.txt" -Destination $hostingStage -Force
          Copy-Item -LiteralPath "client_tags.txt" -Destination $hostingStage -Force

          Remove-Item -LiteralPath $hostingZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $hostingStage "*") -DestinationPath $hostingZip -Force

          @(
            ""
            "### Hosting package"
            "- Upload/extract ``Allclient-$env:CLIENT_TAG-Hosting.zip`` into ``public_html`` before testing installer updates."
            "- Includes ``update_access.php``, ``installer_access.php``, admin panel, ``pinned_servers.txt``, ``mix_servers.txt`` and ``client_tags.txt``."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Install Inno Setup 7.1
        if: inputs.build_mode == 'full_installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"

          curl.exe --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --output $installer $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Inno Setup 7.1.0."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "The Inno Setup installer has an invalid or unexpected digital signature."
          }

          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Cache bundled Microsoft runtimes
        if: inputs.build_mode == 'full_installer'
        uses: actions/cache@v4
        with:
          path: installer/runtime/*.exe
          key: microsoft-runtimes-v2
          restore-keys: microsoft-runtimes-

      - name: Prepare bundled Microsoft runtimes
        if: inputs.build_mode == 'full_installer'
        shell: pwsh
        run: ./installer/Prepare-Runtimes.ps1

      - name: Build Allclient installer
        if: inputs.build_mode == 'full_installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files\Inno Setup 7\ISCC.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "installer\Allclient.iss"
          $installDir = Join-Path $env:GITHUB_WORKSPACE "install"
          $compiledInstaller = Join-Path $env:GITHUB_WORKSPACE "installer\output\Allclient-Setup.exe"
          $finalInstaller = Join-Path $env:GITHUB_WORKSPACE "tagged-output\Allclient-Setup.exe"

          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup 7 compiler was not found after installation."
          }

          & $iscc "/DSourceRoot=$installDir" "/DAppVersion=$env:BUILD_VERSION" "/DBuildTag=$env:CLIENT_TAG" $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $compiledInstaller -PathType Leaf)) {
            throw "Allclient installer compilation failed."
          }

          Copy-Item -LiteralPath $compiledInstaller -Destination $finalInstaller -Force
          $installerSize = [math]::Round((Get-Item -LiteralPath $finalInstaller).Length / 1MB, 1)
          Write-Host "Smart Installer created: $finalInstaller ($installerSize MB)"

          @(
            ""
            "### Smart Installer Package (v$env:BUILD_VERSION)"
            "- Installer: ``Allclient-Setup.exe`` (**$installerSize MB**)"
            "- Auto-detects existing installations & updates automatically without credentials!"
            "- Prompts for login/pass only on fresh installations."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Build lightweight client patch ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchStage = Join-Path $env:RUNNER_TEMP "allclient-patch"
          $patchZip = Join-Path $env:GITHUB_WORKSPACE "tagged-output\Allclient-Patch.zip"
          $installDir = Join-Path $env:GITHUB_WORKSPACE "install"

          Remove-Item -LiteralPath $patchStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $patchStage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $patchStage "cstrike\cl_dlls") | Out-Null

          $binaries = @(
            "Allclient.exe",
            "cstrike.exe",
            "updater.exe",
            "FileSystem_Proxy.dll",
            "next_engine_mini.dll",
            "nitro_api2.dll",
            "steam_api.dll",
            "vgui2.dll",
            "pinned_servers.txt",
            "mix_servers.txt",
            "build-info.txt",
            "version.txt"
          )

          foreach ($bin in $binaries) {
            $src = Join-Path $installDir $bin
            if (Test-Path -LiteralPath $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $patchStage $bin) -Force
            }
          }

          $clDlls = @("client_mini.dll", "GameUI.dll")
          foreach ($dll in $clDlls) {
            $src = Join-Path $installDir "cstrike\cl_dlls\$dll"
            if (Test-Path -LiteralPath $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $patchStage "cstrike\cl_dlls\$dll") -Force
            }
          }

          Remove-Item -LiteralPath $patchZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $patchStage "*") -DestinationPath $patchZip -Force
          $versionedZip = Join-Path $env:GITHUB_WORKSPACE "tagged-output\Allclient-v$env:BUILD_VERSION-Patch.zip"
          Copy-Item -LiteralPath $patchZip -Destination $versionedZip -Force
          $patchSize = [math]::Round((Get-Item -LiteralPath $patchZip).Length / 1MB, 2)
          Write-Host "Patch ZIP created: $patchZip ($patchSize MB)"

          @(
            ""
            "### Lightweight Patch ZIP (~10MB payload)"
            "- Versioned Patch: ``Allclient-v$env:BUILD_VERSION-Patch.zip`` (**$patchSize MB**)"
            "- Latest Patch: ``Allclient-Patch.zip`` (**$patchSize MB**)"
            "- Ready for deployment directly to your server/admin panel!"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Allclient installer
        if: inputs.build_mode == 'full_installer'
        uses: actions/upload-artifact@v4
        with:
          name: Allclient-Setup-${{ github.run_number }}
          path: tagged-output/Allclient-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload lightweight patch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Allclient-v${{ env.BUILD_VERSION }}-Patch-${{ github.run_number }}
          path: tagged-output/Allclient-v${{ env.BUILD_VERSION }}-Patch.zip
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Upload tagged hosting package
        if: inputs.build_mode == 'full_installer'
        uses: actions/upload-artifact@v4
        with:
          name: Allclient-Hosting-${{ github.run_number }}
          path: tagged-output/Allclient-Hosting.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Send installer to Telegram Saved Messages
        shell: pwsh
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_SESSION)) {
            Write-Host "TELEGRAM_SESSION secret is not set. Skipping Telegram upload."
            exit 0
          }
          
          Write-Host "Installing Telethon..."
          python -m pip install --disable-pip-version-check --no-warn-script-location telethon
          
          $script = @"
          import asyncio, os
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = 2040
          api_hash = 'b18441a1ff607e10a989891a5462e627'
          session_string = os.environ.get('TELEGRAM_SESSION')
          build_version = os.environ.get('BUILD_VERSION', 'unknown')
          file_path = 'tagged-output/Allclient-Setup.exe'
          patch_path = f'tagged-output/Allclient-v{build_version}-Patch.zip'

          async def main():
              print('Connecting to Telegram...')
              async with TelegramClient(StringSession(session_string), api_id, api_hash) as client:
                  if os.path.isfile(file_path):
                      print(f'Uploading {file_path} to Saved Messages...')
                      await client.send_file('me', file_path, caption=f'NextClient Smart Installer: v{build_version}\\nWorkflow Run: {os.environ.get("GITHUB_RUN_NUMBER")}')
                  if os.path.isfile(patch_path):
                      print(f'Uploading {patch_path} to Saved Messages...')
                      await client.send_file('me', patch_path, caption=f'NextClient Patch ZIP: v{build_version}\\nWorkflow Run: {os.environ.get("GITHUB_RUN_NUMBER")}')
                  print('Upload complete!')

          asyncio.run(main())
          "@

          Set-Content -Path "send_to_telegram.py" -Value $script -Encoding utf8
          python send_to_telegram.py
