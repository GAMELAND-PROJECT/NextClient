name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer produced by this release build
        uses: actions/download-artifact@v4
        with:
          pattern: Allclient-*-Setup-*
          path: dist
          merge-multiple: true

      - name: Validate and name release installer
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find dist -maxdepth 1 -type f -name 'Allclient-*-Setup.exe' -print)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one installer artifact, found ${#installers[@]}." >&2
            exit 1
          fi
          output="Allclient-${TAG}-Setup.exe"
          mv "${installers[0]}" "$output"
          echo "installer=$output" >> "$GITHUB_OUTPUT"
          echo "### Release installer" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`${output}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.installer }}

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          INSTALLER: ${{ steps.package.outputs.installer }}
        run: gh release upload "$TAG" "$INSTALLER" --clobber --repo "$GITHUB_REPOSITORY"
