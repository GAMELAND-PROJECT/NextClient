// NextClient stable 100 Hz LAN listen-server profile.

hostname "LAN Match Server"
rcon_password ""
sv_lan "1"

// Match the client frame/send cadence. A listen server is driven by fps_max;
// sys_ticrate only controls the dedicated-server branch in this engine.
fps_max "100"
sv_lan_rate "100000"
sv_minrate "100000"
sv_maxrate "100000"
sv_minupdaterate "101"
sv_maxupdaterate "101"
sv_mincmdrate "101"
sv_maxcmdrate "101"

// Server-authoritative lag compensation with no artificial push.
sv_unlag "1"
sv_maxunlag "0.5"
sv_unlagsamples "1"
sv_unlagpush "0"
sv_clienttrace "1"
sv_timeout "60"

// Predictable stock movement for match mode.
sv_gravity "800"
sv_maxspeed "320"
sv_airaccelerate "10"

// Do not spend LAN bandwidth accepting custom client uploads.
sv_allowdownload "1"
sv_allowupload "0"
sv_consistency "1"

sv_voiceenable "1"
sv_voicequality "5"
sv_alltalk "0"

sv_cheats "0"
sv_pausable "0"
mp_autokick "0"
mp_tkpunish "0"
mp_autoteambalance "0"
mp_limitteams "0"
mp_allowspectators "1"
mp_c4timer "35"
mp_freezetime "12"
mp_roundtime "1.75"
mp_buytime "0.25"
mp_friendlyfire "1"
mp_startmoney "800"
mp_forcerespawn "0"
mp_fadetoblack "1"
mp_forcecamera "2"
mp_forcechasecam "2"
mp_round_restart_delay "5"

sv_enablebunnyhopping "0"
sv_autobunnyhopping "0"

alias r "sv_restartround 1; say === ROUND RESTARTED ==="
alias warm "mp_startmoney 16000; mp_buytime 99; mp_fadetoblack 0; mp_friendlyfire 0; mp_freezetime 0; mp_roundtime 5; sv_alltalk 1; mp_forcerespawn 1; sv_enablebunnyhopping 1; sv_autobunnyhopping 1; sv_airaccelerate 100; sv_restartround 1; say === WARMUP MODE ==="
alias mix "mp_startmoney 800; mp_buytime 0.25; mp_fadetoblack 1; mp_friendlyfire 1; mp_freezetime 12; mp_roundtime 1.75; sv_alltalk 0; mp_forcerespawn 0; sv_enablebunnyhopping 0; sv_autobunnyhopping 0; sv_airaccelerate 10; sv_restartround 1; say === MATCH MODE ==="
alias 1v1 "mp_startmoney 16000; mp_buytime 0; mp_fadetoblack 0; mp_friendlyfire 0; mp_freezetime 0; mp_roundtime 0.5; sv_alltalk 1; mp_forcerespawn 0; sv_enablebunnyhopping 0; sv_autobunnyhopping 0; sv_airaccelerate 10; sv_restartround 1; say === 1V1 MODE ==="

alias w5 "wait;wait;wait;wait;wait"
alias LV "say === MATCH LIVE IN 3 ===; w5; sv_restartround 3; w5; say === 2 ===; w5; say === 1 ===; w5; say === LIVE ==="
alias LIVE "LV"

echo ">> NEXTCLIENT STABLE LAN PROFILE LOADED"
