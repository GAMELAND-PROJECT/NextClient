      <stop offset="0%" stop-color="#00ffb3"/>
      <stop offset="50%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
