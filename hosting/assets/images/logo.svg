    <circle cx="40" cy="42" r="6" fill="url(#primaryGlow)"/>
    <line x1="40" y1="18" x2="40" y2="30" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="54" x2="40" y2="66" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="42" x2="28" y2="42" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="42" x2="64" y2="42" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

